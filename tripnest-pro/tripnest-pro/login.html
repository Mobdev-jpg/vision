<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — TripNest</title><meta name="description" content="Login to TripNest with Google or mobile number and password. No SMS OTP login."><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">TN</span>TripNest</a><div class="nav-actions"><a class="btn btn-light" href="/">← Back</a></div></div></header><main class="auth-shell"><section class="auth-card"><span class="eyebrow">TRIPNEST ACCOUNT</span><h1 id="formTitle">Login</h1><p>Use Google, or use your mobile number with a password. This app does not use SMS OTP login.</p><button id="google" class="btn google-btn">Continue with Google</button><div class="auth-divider">or mobile + password</div><form id="authForm" class="auth-form"><label>Mobile number<input id="phone" required type="tel" placeholder="+91 9876543210"></label><label>Password<input id="password" required type="password" minlength="6" placeholder="••••••••"></label><button class="btn btn-primary" id="submitBtn">Login</button><div id="msg" class="message"></div></form><div class="mode-switch"><button class="active" id="loginMode" type="button">Login</button><button id="signupMode" type="button">Create account</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/auth.js"></script></body></html>
